openapi: 3.1.0
info:
  title: Mantis Dashboard Mock API
  version: 1.0.0
servers:
  - url: http://localhost:4000
paths:
  /stats:
    get:
      summary: Dashboard summary metrics
      responses:
        '200':
          description: Metric list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Stat' }
  /orders:
    get:
      summary: Recent orders
      responses:
        '200':
          description: Order list
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Order' } }
  /customers:
    get:
      summary: Customer directory
      responses:
        '200':
          description: Customer list
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Customer' } }
  /products:
    get:
      summary: Product catalog
      responses:
        '200':
          description: Product list
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Product' } }
components:
  schemas:
    Stat:
      type: object
      required: [id, label, value, change, color]
      properties:
        id: { type: string }
        label: { type: string }
        value: { type: string }
        change: { type: number }
        color: { type: string }
    Order:
      type: object
      required: [id, product, quantity, status, amount]
      properties:
        id: { type: string }
        product: { type: string }
        quantity: { type: integer }
        status: { type: string, enum: [Approved, Pending, Rejected] }
        amount: { type: number }
    Customer:
      type: object
      required: [id, name, email, phone, age, country, status]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        age: { type: integer }
        country: { type: string }
        status: { type: string, enum: [Complete, Pending, Canceled] }
    Product:
      type: object
      required: [id, name, category, price, stock, rating]
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string }
        price: { type: number }
        stock: { type: integer }
        rating: { type: number }
