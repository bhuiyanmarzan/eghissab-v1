services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: "8080"
      ENV: "development"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      LOG_LEVEL: debug
    volumes:
      - ./backend:/app
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
