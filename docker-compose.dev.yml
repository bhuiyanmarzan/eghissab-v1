services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: "8080"
      ENV: "development"
      DATABASE_URL: postgres://${POSTGRES_APP_USER:-eghissab_app}:${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      AUTH_SIGNING_KEY: ${AUTH_SIGNING_KEY}
      AUTH_ISSUER: ${AUTH_ISSUER}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE}
      AUTH_VERIFICATION_URL: ${AUTH_VERIFICATION_URL}
      AUTH_TRUSTED_PROXY_CIDRS: ${AUTH_TRUSTED_PROXY_CIDRS}
      SMTP_ADDR: ${SMTP_ADDR}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      LOG_LEVEL: debug
    volumes:
      - ./backend:/app
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
