services:
  postgres:
    image: postgres:17-alpine
    container_name: eghissab_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Tuned for a small EC2 (1 GB RAM)
    command: >
      postgres -c max_connections=50 -c shared_buffers=128MB -c work_mem=4MB -c maintenance_work_mem=64MB
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 320m
    logging: &log
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ---- Go API ----
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: "8080"
      ENV: "production"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 128m
    logging: *log
    healthcheck:
      test: [ "CMD", "/app/bin/api", "--health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---- nginx + React static ----
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 64m
    logging: *log
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost/healthz" ]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---- Migration tools ----
  migrate-up:
    profiles: ["tools"]
    build:
      context: ./backend
    entrypoint: ["/app/bin/migrate", "up"]
    environment:
      PORT: "8080"
      ENV: "production"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  migrate-down:
    profiles: ["tools"]
    build:
      context: ./backend
    entrypoint: ["/app/bin/migrate", "down"]
    environment:
      PORT: "8080"
      ENV: "production"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
