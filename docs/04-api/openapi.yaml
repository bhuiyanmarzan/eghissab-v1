  "components": {
    "schemas": {
      "Listing": {
        "type": "object",
        "required": [
          "id",
          "title",
          "description",
          "price",
          "city",
          "created_at"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "title": {
            "type": "string"
          },
          "description": {
            "type": "string"
          },
          "price": {
            "type": "integer",
            "format": "int64"
          },
          "city": {
            "type": "string"
          },
          "created_at": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "CreateListing": {
        "type": "object",
        "required": [
          "title",
          "description",
          "price",
          "city"
        ],
        "description": "Server trims strings; lengths are measured as UTF-8 byte counts, not Unicode character counts. Unknown fields currently accepted.",
        "properties": {
          "title": {
            "type": "string",
            "description": "3\u2013100 bytes after trim"
          },
          "description": {
            "type": "string",
            "description": "3\u20135000 bytes after trim"
          },
          "city": {
            "type": "string",
            "description": "2\u201350 bytes after trim"
          },
          "price": {
            "type": "integer",
            "format": "int64",
            "minimum": 1,
            "maximum": 1000000000000
          }
        }
      },
      "Error": {
        "type": "object",
        "required": [
          "error"
        ],
        "properties": {
          "error": {
            "type": "object",
            "required": [
              "code",
              "message"
            ],
            "properties": {
              "code": {
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "field": {
                "type": "string"
              }
            }
          }
        }
      },
      "AuthTokens": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "access_token": {
            "type": "string"
          },
          "refresh_token": {
            "type": "string"
          },
          "token_type": {
            "type": "string"
          },
          "expires_in": {
            "type": "integer",
            "example": 600
          }
        },
        "required": [
          "access_token",
          "refresh_token",
          "token_type",
          "expires_in"
        ]
      },
      "AuthProfile": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string"
          },
          "first_name": {
            "type": "string"
          },
          "last_name": {
            "type": "string"
          },
          "email": {
            "type": "string"
          },
          "status": {
            "type": "string"
          }
        },
        "required": [
          "id",
          "first_name",
          "last_name",
          "email",
          "status"
        ]
      }
    },
    "securitySchemes": {
      "BearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT"
      }
    }
  }
}
